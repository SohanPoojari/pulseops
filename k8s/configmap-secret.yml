# 1. ConfigMap: For non-sensitive configuration data
apiVersion: v1
kind: ConfigMap
metadata:
  name: pulseops-config
data:
  # These are safe to commit to Git
  APP_ENV: "staging"
  LOG_LEVEL: "info"
  WORKER_TIMEOUT: "300"

---
# 2. Secret: For sensitive data (like database/redis URLs)
apiVersion: v1
kind: Secret
metadata:
  name: pulseops-secrets
type: Opaque
data:
  # CRITICAL: Never commit real base64-encoded production secrets to Git!
  # These are dummy values used ONLY for local/staging bootstrapping.
  # In a real pipeline, these values are injected via GitHub Secrets or AWS Secrets Manager.
  
  # "redis://redis:6379/0" base64 encoded for demonstration
  redis-url: cmVkaXM6Ly9yZWRpczo2Mzc5LzA= 
  
  # "postgres://user:password@localhost:5432/jobs_db" base64 encoded for demonstration
  database-url: cG9zdGdyZXM6Ly91c2VyOnBhc3N3b3JkQGxvY2FsaG9zdDo1NDMyL2pvYnNfZGI=